      .tile--correct .tile__ch { color:#0D131B; }

      }

      .tile--win {
        position: relative;
        overflow: hidden;
      }
      .tile--win::after {
        content:"";
        position:absolute;
        inset:-20%;
        background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,.25) 50%, transparent 60%);
        transform: translateX(-120%) rotate(10deg);
        animation: sheen 1200ms ease-out forwards;
        animation-delay: var(--win-delay, 400ms);
      }

      @keyframes sheen { to { transform: translateX(120%) rotate(10deg); } }
      
      @keyframes flipX {
        0% { transform: rotateX(0deg); }
        50% { transform: rotateX(90deg); }
        100% { transform: rotateX(0deg); }

      .tile--reveal { animation: flipX 600ms cubic-bezier(.2,.8,.2,1) both; }

    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;

        // When the new Service Worker takes control, reload automatically
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            // Check for updates on initial page load
            registration.update().catch(() => {});

            // Check for updates every time user re-opens or switches back to the PWA
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') {
                registration.update().catch(() => {});
              }
            });

            // If an updated worker is already waiting, activate it immediately
            if (registration.waiting) {
              registration.waiting.postMessage('SKIP_WAITING');
            }

            // When an update is found, activate it as soon as installation completes
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage('SKIP_WAITING');
                  }
                });
              }
            });
          }).catch((err) => {
            console.error('SW registration failed:', err);
          });
        });
      }
