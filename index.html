    <style>
      :root {
        --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        --cols: 5;
        --gap: 8px;
        --tile: clamp(40px, min(13vw, 7.5vh), 64px);
      }
      .mode-4 {
        --cols: 4;
        --tile: clamp(48px, min(16vw, 8.5vh), 68px);
      }
      .mode-5 {
        --cols: 5;
        --tile: clamp(42px, min(13.5vw, 7.5vh), 64px);
      }
      .mode-6 {
        --cols: 6;
        --tile: clamp(36px, min(11.5vw, 6.5vh), 56px);
      }
      @media (max-width: 380px) {
        :root { --gap: 5px; }
      }
      
      html {
        color-scheme: dark;
      }
      body {
        font-family: var(--font-ui);
        background-color: #0E1420;
        background-image: radial-gradient(circle at center, #141B2D 0%, #0E1420 80%);
        background-attachment: fixed;
        position: relative;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAMAAAADCAYAAABWKLW/AAAAAXNSR0IArs4c6QAAACNJREFUCJljYGBgYGJgYGBgYGBkZGRkZGRkZGRkZGRkZGRkYAAAChAChrQo/pYAAAAASUVORK5CYII=");
        opacity: 0.03;
        pointer-events: none;
      }

      .row-grid {
        display: grid;
        grid-template-columns: repeat(var(--cols), 1fr);
        gap: var(--gap);
      }
      
      .tile {
        width: var(--tile);
        height: var(--tile);
        border-radius: 14px;
        background: rgba(255,255,255,.05);
        border: 1.2px solid #263043;
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.06),
          0 10px 32px rgba(0,0,0,.28);
        display: grid;
        place-items: center;
        overflow: visible;
        will-change: transform;
      }

      .tile__ch {
        font-family: var(--font-ui);
        font-weight: 700;
        line-height: 1;
        letter-spacing: .01em;
        font-size: clamp(28px, calc(var(--tile) * .58), 42px);
        color: #E8EEF7;
        transform: translateY(-1px);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .tile--absent  { background:#1F2937; border-color:#2A3345; }
      .tile--present { background:#EAB308; }
      .tile--correct { background:#22C55E; }
      
      .tile--present .tile__ch { color:#0D0F14; }
      .tile--correct .tile__ch { color:#0D131B; }

      .tile--present,
      .tile--correct {
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.08),
          0 6px 24px rgba(0,0,0,.25),
          0 8px 32px rgba(124,92,255,.06);
      }

      .tile--win {
        position: relative;
        overflow: hidden;
      }
      .tile--win::after {
        content:"";
        position:absolute;
        inset:-20%;
        background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,.25) 50%, transparent 60%);
        transform: translateX(-120%) rotate(10deg);
        animation: sheen 1200ms ease-out forwards;
        animation-delay: var(--win-delay, 400ms);
      }

      @keyframes sheen { to { transform: translateX(120%) rotate(10deg); } }
      
      @keyframes flipTile {
        0% {
          transform: rotateX(0deg);
          background: rgba(255,255,255,.05);
          border-color: #3A4454;
        }
        49.9% {
          transform: rotateX(90deg);
          background: rgba(255,255,255,.05);
          border-color: #3A4454;
        }
        50% {
          transform: rotateX(90deg);
          background: var(--tile-target-bg);
          border-color: var(--tile-target-border);
        }
        100% {
          transform: rotateX(0deg);
          background: var(--tile-target-bg);
          border-color: var(--tile-target-border);
        }
      }

      .tile--reveal {
        animation: flipTile 500ms cubic-bezier(.4, 0, .2, 1) both;
        backface-visibility: hidden;
      }
      .tile--reveal.tile--correct {
        --tile-target-bg: #22C55E;
        --tile-target-border: #22C55E;
      }
      .tile--reveal.tile--present {
        --tile-target-bg: #EAB308;
        --tile-target-border: #EAB308;
      }
      .tile--reveal.tile--absent {
        --tile-target-bg: #1F2937;
        --tile-target-border: #2A3345;
      }

      .tile--reveal.tile--correct .tile__ch {
        animation: flipChCorrect 500ms ease-in-out both;
        animation-delay: inherit;
      }
      .tile--reveal.tile--present .tile__ch {
        animation: flipChPresent 500ms ease-in-out both;
        animation-delay: inherit;
      }

      @keyframes flipChCorrect {
        0%, 49.9% { color: #E8EEF7; }
        50%, 100% { color: #0D131B; }
      }
      @keyframes flipChPresent {
        0%, 49.9% { color: #E8EEF7; }
        50%, 100% { color: #0D0F14; }
      }

      @keyframes popIn {
        0% { transform: scale(1); }
        50% { transform: scale(1.06); }
        100% { transform: scale(1); }
      }
      .tile--pop { animation: popIn 120ms ease-out; }

      @keyframes shake {
        0%,100% { transform: translateX(0); }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
      }
      .row--shake .tile { animation: shake 300ms ease-in-out; }

      *:focus-visible {
        outline: 2px solid #7C5CFF;
        outline-offset: 2px;
        border-radius: 4px;
      }
      
       body::-webkit-scrollbar { display: none; }
       body { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes zoom-in {
        from { transform: scale(0.9); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
      }
      .animate-zoom-in { animation: zoom-in 0.2s ease-out; }

      @keyframes fade-in-out {
        0%, 100% { opacity: 0; transform: translateY(-20px) translateX(-50%); }
        10%, 90%  { opacity: 1; transform: translateY(0)    translateX(-50%); }
      }
      .animate-fade-in-out { animation: fade-in-out 2s ease-in-out; }

      @keyframes slide-up {
        from { opacity: 0; transform: translateX(-50%) translateY(24px); }
        to   { opacity: 1; transform: translateX(-50%) translateY(0); }
      }
      .animate-slide-up { animation: slide-up 0.3s cubic-bezier(.2,.8,.2,1) both; }
    </style>
</head>

    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;

        // When the new Service Worker takes control, reload automatically
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            // Check for updates on initial page load
            registration.update().catch(() => {});

            // Check for updates every time user re-opens or switches back to the PWA
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') {
                registration.update().catch(() => {});
              }
            });

            // If an updated worker is already waiting, activate it immediately
            if (registration.waiting) {
              registration.waiting.postMessage('SKIP_WAITING');
            }

            // When an update is found, activate it as soon as installation completes
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage('SKIP_WAITING');
                  }
                });
              }
            });
          }).catch((err) => {
            console.error('SW registration failed:', err);
          });
        });
      }
    </script>
